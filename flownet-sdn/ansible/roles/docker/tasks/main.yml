---
- name: Install Docker Engine and the Compose plugin (Ubuntu 24.04 packages)
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the login user to run docker without sudo
  ansible.builtin.user:
    name: "{{ flownet_user }}"
    groups: docker
    append: true
  when: flownet_user != "root"
