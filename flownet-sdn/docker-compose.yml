# Two ways to run FlowNet:
#   Live  (Linux VM with Mininet/OVS):  docker compose --profile live --env-file .env up -d --build
#   Demo  (any machine, simulated data): docker compose --profile demo up -d --build
name: flownet

services:
  controller:                      # Ryu SDN controller (OpenFlow 1.3 + REST)
    profiles: [live]
    build: ./controller
    restart: unless-stopped
    ports:
      - "127.0.0.1:6653:6653"      # OpenFlow: only local switches (Open vSwitch on this VM) connect here
    networks: [flownet]            # REST :8080 is reachable from the backend only, never published

  backend-live:
    profiles: [live]
    build: ./backend
    restart: unless-stopped
    depends_on: [controller]
    environment:
      DEMO_MODE: "false"
      RYU_URL: http://controller:8080
      LAB_AGENT_URL: http://172.28.0.1:5000   # Mininet agent runs on the VM, bound to the docker gateway
      DB_PATH: /data/flownet.db
      TOPOLOGY_FILE: /app/lab_config/topology.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./network-lab/lab_config:/app/lab_config:ro
      - backend-data:/data
    ports: ["8000:8000"]
    networks:
      flownet: {aliases: [backend]}

  backend-demo:
    profiles: [demo]
    build: ./backend
    restart: unless-stopped
    environment:
      DEMO_MODE: "true"
      DB_PATH: /data/flownet.db
      TOPOLOGY_FILE: /app/lab_config/topology.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./network-lab/lab_config:/app/lab_config:ro
      - backend-data:/data
    ports: ["8000:8000"]
    networks:
      flownet: {aliases: [backend]}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [flownet]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flownet.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [flownet]

networks:
  flownet:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1      # the VM's address on this network; the lab agent binds here

volumes:
  backend-data:
  prometheus-data:
  grafana-data:
